- id: title
  layout: title
  title: Learning Microbial Metabolism from Simulations
  author: Teemu Ruokokoski
  affiliation: Doctoral Researcher · University of Helsinki
  project: FoodID
  collaboration: in collaboration with VTT
  notes: |
    My research combines machine learning and metabolic modeling. The idea is to train neural networks using large amounts of simulated metabolic data and then apply them to real experimental problems. I'll explain the biological motivation, how we generate the training data, and what we have achieved with our Transformer-based model, FluxFormer.
- id: goal
  title: From waste to value
  content: |
    - Industrial and agricultural side streams contain valuable nutrients.
    - Microorganisms can convert them into biomass, proteins, and chemicals.
    - Goal: efficient and sustainable bioproduction.
  image: /pics/fluxformer/side-stream-bioproduction.png
  alt: Nutrients from a side stream feed microorganisms in a bioreactor. The cells convert them into microbial biomass and secreted metabolites.
  notes: |
    Many industrial and agricultural processes produce side streams that still contain useful nutrients. Instead of wasting these resources, we could use microorganisms to convert them into valuable products. The challenge is to find suitable microorganisms and cultivation conditions that make this conversion as efficient as possible.
- id: motivation
  title: Microbial metabolism
  content: |
    - Microorganisms consume nutrients, such as sugars and oxygen.
    - Chemical reactions convert nutrients into other substances.
    - Metabolism provides energy, materials for cell growth, and other useful products.
    - Metabolic flux describes how fast each reaction proceeds.
  image: /pics/fluxformer/microbial-metabolism.png
  alt: Nutrients enter a microbial cell and pass through connected metabolic reactions that generate ATP, biomass precursors, and secreted metabolites.
  notes: |
    We can think of microorganisms as small chemical factories. Nutrients enter the cell and pass through connected biochemical reactions, where substances are converted into other substances. The product of one reaction can become the starting material for another, forming metabolic pathways. These reactions produce energy and the building blocks needed for growth, as well as compounds that can be released from the cell. The rate of each reaction is called its metabolic flux. Together, these fluxes describe how nutrients flow through the cell's metabolic network.
- id: metabolism
  layout: wide
  title: Metabolic models
  content: |
    - Genome-scale metabolic models describe cellular reaction networks.
    - Our E. coli model, iML1515, contains 2,712 reactions.
    - Flux Balance Analysis (FBA) predicts reaction fluxes.
  equation: fba
  image: /pics/fluxformer/metabolic-models-fba.png
  alt: Five panels connect a reaction network to its stoichiometric matrix, steady-state mass balance, feasible flux space, and optimal flux solution.
  notes: |
    We can describe metabolism mathematically using a network of biochemical reactions. Genome-scale metabolic models collect the known reactions of an organism. FBA uses the network's stoichiometry, reaction constraints, and an objective function, usually biomass production, to predict a possible flux distribution. In our current research, we use the E. coli model iML1515.
- id: fba
  layout: stats
  title: The data problem
  content: |
    - Biological experiments are expensive and time-consuming.
    - Nutrient uptake rates are often unknown.
    - Experimental datasets are usually small.
    - Limited training data makes neural networks prone to overfitting.
  stats:
    - value: "110"
      label: Growth conditions
      caption: Growth-prediction benchmark
    - value: "29"
      label: Omics conditions
      caption: Missing-flux benchmark
  notes: |
    The main difficulty with neural networks in biology is the shortage of experimental training data. For example, our growth-prediction benchmark contains only 110 different media, and the omics dataset contains just 29 conditions. With so few examples, neural networks can easily overfit and struggle to generalize to new conditions. In addition, knowing which nutrients are present does not directly tell us their uptake rates, which FBA requires. We need a way to learn from much more data.
- id: pretraining
  layout: figure
  title: Virtual experiments
  image: /pics/fluxformer/virtual-experiments-workflow.png
  alt: Four workflow panels show the FluxFormer model, generation of FBA-simulated training pairs, pretraining on simulated fluxes, and transfer to experimental growth and omics tasks.
  notes: |
    Our solution is to use the metabolic model to generate training data. We can simulate many different nutrient conditions and calculate the corresponding flux distributions using FBA. We then train a neural network to reproduce these predictions. Once trained, the neural network can be reused with experimental data, where only a small amount of measured information is available.
- id: simulated-data
  layout: wide
  title: Generating simulated data
  content: |
    - Sample nutrient availability and uptake limits.
    - Calculate fluxes using parsimonious FBA (pFBA).
    - Store input constraints and complete flux distributions.
  image: /pics/fluxformer/simulated-data-generation.png
  alt: Five steps load the metabolic model, sample a growth medium, set uptake bounds, solve the flux optimization problem, and store the input constraints and full flux distribution as a training example. The process repeats for many conditions.
  notes: |
    Each virtual experiment starts by selecting which nutrients are available and assigning their uptake limits. We then solve the metabolic model using pFBA, which selects a parsimonious solution among flux distributions that achieve the specified biomass optimum. The resulting input constraints and complete flux distribution form one training example. By repeating this process, we can generate very large datasets.
- id: architecture
  title: FluxFormer architecture
  content: |
    - One token per metabolic reaction.
    - Self-attention learns relationships between reactions.
    - Predicts the complete flux distribution.
  image: /pics/fluxformer/fluxformer-architecture.png
  alt: A FluxFormer layer updates reaction embeddings X and scalar values c together. Multi-head self-attention updates embeddings, its attention weights propagate scalar values through matrix multiplication, and the concatenated representations pass through a feed-forward block with residual connections.
  notes: |
    FluxFormer is a Transformer architecture designed for metabolic flux prediction. Each reaction has its own learned embedding and a scalar value that carries flux information. Self-attention allows information to propagate between reactions, while the model updates the embeddings and scalar values together. This enables FluxFormer to predict the entire flux distribution without solving a separate optimization problem.
- id: nutrient-distributions
  title: Training across nutrient distributions
  content: |
    - Train separate FluxFormer models on six simulated nutrient distributions.
    - A, B: Task-specific conditions.
    - A ∪ B, C: Combined and intermediate conditions.
    - D, E: Broader nutrient conditions.
  image: /pics/fluxformer/nutrient-distributions.png
  alt: Conceptual condition spaces show task-specific distributions A and B surrounding the AMN and MINN datasets, distribution C including intermediate conditions, and broader distributions D and E enclosing both. A legend distinguishes model distributions from experimental data, and the model set includes A, B, A union B, C, D, and E.
  notes: |
    We train FluxFormer to predict the complete pFBA flux distribution from simulated nutrient constraints. The main question is how the choice of training conditions affects its performance and ability to transfer to experimental tasks.

    We compare six pretraining distributions using the same FluxFormer architecture. A and B represent two different experimental settings. A union B combines these settings, while C introduces intermediate conditions. D and E extend training to a much broader range of nutrients, which I will explain next.

    The goal is to understand whether a broadly pretrained surrogate can be reused across different applications without requiring task-specific pretraining.
- id: broad-sampling
  title: "Broad sampling: D and E distributions"
  content: |
    - 48 organic sources selected using metabolic screening and literature.
    - D: 80% broad, 20% task-specific.
    - E: 100% broad.
    - 1–10 sources per medium; oxygen varied separately.
  image: /pics/fluxformer/broad-de-distributions.png
  alt: Three panels show a pool of 48 organic sources selected by metabolic screening and literature, the D mixture of 80 percent broad and 10 percent each A-style and B-style samples versus E with 100 percent broad samples, and media containing one to ten sources with oxygen varied separately and smaller mixtures sampled more often.
  notes: |
    For D and E, we first screened the metabolic model for organic compounds that could support simulated growth. We then used an LLM-assisted literature review to select sources relevant to industrial and agricultural side streams. The final pool contains 48 compounds. We sample mixtures containing one to ten sources. Model D also includes some conditions from the earlier task-specific distributions, while E is trained entirely on the broad distribution.
- id: simulated-performance
  layout: table
  title: Simulated performance
  content: |
    - All six models reproduce pFBA predictions accurately.
    - Even the broadest model E reaches <i>R</i><sup>2</sup> = 0.9980.
  table:
    label: Simulated surrogate fidelity on independent test data from each model's pretraining distribution, pooled across conditions and all 2,712 output fluxes.
    headers: [Model, R², MAE, RMSE]
    highlight: E
    rows:
      - model: A
        values: ["0.9997", "0.0032", "0.0283"]
      - model: B
        values: ["1.0000", "0.0020", "0.0090"]
      - model: A ∪ B
        values: ["0.9998", "0.0040", "0.0186"]
      - model: C
        values: ["0.9998", "0.0037", "0.0207"]
      - model: D
        values: ["0.9993", "0.0033", "0.0246"]
      - model: E
        values: ["0.9980", "0.0064", "0.0614"]
  notes: |
    We first tested how well each pretrained FluxFormer reproduces pFBA on independently generated simulated conditions. All models achieved very high accuracy across the 2,712 predicted fluxes. Model E has slightly larger errors, which is expected given its much broader nutrient space. These tests use the corresponding pretraining distribution for each model, so they primarily measure how well each model has learned its own simulation task.
- id: experimental-transfer
  title: Transfer to experiments
  content: |
    - Freeze pretrained FluxFormer.
    - Train a small MLP using experimental data.
    - Predict growth or infer missing exchange constraints.
  image: /pics/fluxformer/experimental-transfer.png
  alt: Panels A and B show experimental transfer pipelines. An MLP maps medium composition or omics data to exchange constraints supplied to pretrained FluxFormer, producing predicted steady-state fluxes for growth prediction or missing-flux prediction.
  notes: |
    The next question is whether the simulated pretraining is useful for real experimental tasks. We use a two-stage approach. FluxFormer is pretrained and then frozen. A small neural network is trained using experimental data to estimate the exchange constraints that FluxFormer needs. We evaluate this approach on two different tasks: growth prediction and missing-flux prediction.
- id: growth-prediction
  title: Predicting growth
  content: |
    - 110 experimental E. coli nutrient conditions.
    - 1–4 variable carbon sources per condition, with a fixed basal medium.
    - Goal: predict microbial growth rate.
  image: /pics/fluxformer/growth-prediction-pipeline.png
  alt: Panel A shows the growth-prediction pipeline. Binary medium composition enters an MLP, which predicts exchange constraints for pretrained FluxFormer. Predicted steady-state fluxes include the biomass flux used to predict growth.
  notes: |
    The first experimental task comes from the Artificial Metabolic Network study by Faure and colleagues. It contains 110 nutrient conditions, each with one to four carbon sources selected from a set of ten. The input to our model is a binary vector indicating which of the ten variable carbon sources are present. An MLP maps this information to uptake constraints for the frozen FluxFormer, which then predicts the growth rate. We evaluate performance using repeated stratified 10-fold cross-validation.
- id: results
  title: Growth prediction results
  content: |
    - All five applicable FluxFormer models outperform the baselines.
    - Broad model E: <i>R</i><sup>2</sup> = 0.86.
    - Task-specific model A: <i>R</i><sup>2</sup> = 0.88.
  image: /pics/fluxformer/growth-prediction-results.png
  alt: Article Figure 4 compares predicted and measured growth rates for models A and E, with uncertainty bars, identity lines, and the original repeat-level performance annotations retained in each panel.
  comparison:
    - label: Published AMN
      score: ≈ 0.78
    - label: TabPFN-3
      score: = 0.806
  notes: |
    All five applicable FluxFormer models perform better than the published AMN models and our TabPFN baseline. The most interesting result is that the broadly pretrained model E performs almost as well as the specialized model A. Models A union B, C, and D also obtain similar results. This suggests that we can train on a much wider range of nutrient conditions without losing much accuracy on a particular experimental task.
- id: missing-flux
  layout: table
  title: Missing flux prediction
  content: |
    - 29 experimental omics conditions.
    - Glucose and oxygen inputs, infer three missing exchange constraints.
    - pFBA prediction improves: <i>r</i><sup>2</sup> = 0.893 → 0.908.
  table:
    label: Missing-flux prediction performance, comparing published iAF1260-based methods with the iML1515 pFBA baseline and Model B plus pFBA. The metric r squared is squared Pearson correlation.
    headers: [Model, r², MAE, RMSE, NE]
    wide: true
    rows:
      - model: pFBA (iAF1260-based)
        values: ["0.892 ± 0.127", "0.496 ± 0.353", "0.836 ± 0.625", "0.306 ± 0.367"]
      - model: MINN-Reservoir + pFBA
        values: ["0.910 ± 0.091", "0.445 ± 0.261", "0.740 ± 0.421", "0.253 ± 0.159"]
      - model: pFBA (iML1515)
        highlight: true
        values: ["0.893 ± 0.132", "0.495 ± 0.366", "0.832 ± 0.634", "0.309 ± 0.373"]
      - model: Model B + pFBA (iML1515)
        highlight: true
        values: ["0.908 ± 0.111", "0.455 ± 0.322", "0.774 ± 0.546", "0.284 ± 0.312"]
  notes: |
    The second task uses experimental measurements of gene expression, protein abundance, and metabolic fluxes. We use FluxFormer model B to infer missing constraints for carbon dioxide, ethanol, and acetate. These additional constraints improve the subsequent pFBA predictions, reaching performance close to the published MINN approach. The dataset is very small, so these results are more sensitive to individual observations. The evaluation also uses FBA-fitted experimental flux targets.
- id: reaction-embeddings
  title: Inside FluxFormer
  content: |
    - 14 glycolysis-related reactions across 4,000 simulated nutrient conditions.
    - Each point represents one reaction embedding under one condition.
    - Rainbow colors indicate nutrient conditions ordered by similarity.
    - Reactions form distinct clusters, with structured color patterns within them.
  image: /pics/fluxformer/reaction-embeddings-sampled-media.png
  alt: Rainbow-colored t-SNE projection of model E's final glycolysis-related reaction embeddings under 4,000 sampled nutrient conditions. Labeled reaction clusters share color patterns corresponding to medium ordering, shown by the Start-to-End color bar.
  notes: |
    We wanted to investigate what FluxFormer learns internally. We extracted the 256-dimensional reaction embeddings and projected them into two dimensions using t-SNE. Each point represents one reaction under a particular nutrient condition. The colors show the ordering of nutrient conditions based on similarity in their inputs, so nearby colors generally represent similar conditions.

    We can see that each reaction forms its own cluster. More interestingly, the colors often change gradually within these clusters, suggesting that FluxFormer's internal representations respond systematically to changes in nutrient composition.
- id: outlook
  layout: figure
  title: Fructose and oxygen sweeps
  image: /pics/fluxformer/fructose-oxygen-sweeps.png
  alt: Two controlled-sweep t-SNE plots use identical reaction embedding coordinates. The left plot is colored by fructose uptake bound on the original 0.05 to 2.2 scale; the right plot is colored by oxygen uptake bound on the original 1 to 10 scale. Both retain their reaction labels, axes and color bars.
  notes: |
    To investigate this more systematically, we varied fructose and oxygen uptake bounds over a grid of 10,000 combinations while keeping the other inputs fixed. Both plots show the same embeddings and the same t-SNE coordinates. Only the coloring changes. We can see that different reactions respond differently to changes in fructose and oxygen availability. This illustrates how the model's internal representations depend on specific nutrient conditions.
- id: discussion
  layout: text
  title: Discussion
  content: |
    - FluxFormer learns accurate approximations of pFBA using the genome-scale metabolic model.
    - Outperforms AMN and TabPFN in experimental growth prediction.
    - Improves missing-flux prediction, with performance similar to MINN.
    - Broad, task-agnostic pretraining nearly matches task-specific models.
    - Learned reaction representations reflect nutrient conditions.
    - Biological accuracy depends on the metabolic model and simulation assumptions.
  notes: |
    Our results show that a Transformer can learn the behavior of a genome-scale metabolic model and that the learned surrogate can be useful when experimental data are scarce. FluxFormer outperforms the earlier AMN and TabPFN benchmarks in experimental growth prediction. It also improves missing-flux predictions, achieving performance similar to MINN.

    Broad simulated pretraining is particularly promising, as it achieves nearly the same growth-prediction accuracy as task-specific pretraining. The learned reaction representations also show systematic changes with nutrient conditions, suggesting that the model captures structure in metabolic behavior.

    However, FluxFormer learns from pFBA predictions, so its biological accuracy is limited by the metabolic reconstruction, uptake constraints, and assumptions used in the simulations. Predicting real industrial processes will require more realistic training conditions and experimental validation.
- id: foundation-model
  layout: text
  title: Toward a metabolic foundation model
  content: |
    - Develop a single FluxFormer for multiple microorganisms.
    - Map shared reactions and learn organism-specific embeddings.
    - Expand training using 12 fungal metabolic models and experimental data from VTT.
    - Use AI agents to refine simulated conditions based on scientific literature.
    - Identify suitable microorganisms and growth conditions for specific side streams.
  notes: |
    Our next goal is to develop a more general FluxFormer that can learn metabolism across different microorganisms, potentially moving toward a foundation model for metabolic prediction. Instead of training a separate model for each organism, we want to train a single model with organism-specific embeddings. This requires mapping equivalent reactions across metabolic models, since many reactions are shared between organisms, while others are organism-specific. We already have 12 fungal metabolic models and some experimental data from VTT that we can use to extend and evaluate this approach.

    We are also developing an AI-agent workflow that automatically searches scientific literature to improve the biological realism of simulated nutrient conditions. For example, if a sampled medium contains a compound known to inhibit a particular metabolic reaction, that information could be used to adjust the simulation constraints.

    Ultimately, we want to use these more general surrogates to identify which microorganisms are best suited to different industrial and agricultural side streams, and under which cultivation conditions they could produce valuable products efficiently.
