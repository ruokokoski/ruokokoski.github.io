title: "Research Notes and Insights"
url: "https://ruokokoski.github.io"
baseurl: ""
repository: "ruokokoski/ruokokoski.github.io"
lang: "en"
author: "Teemu Ruokokoski"
description: "Projects, code, and ideas on AI, modeling, and scientific computing."

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
email: "teemu.ruokokoski@helsinki.fi"
#twitter_username: "twitteruser"
github_username: "ruokokoski"
#linkedin_username: "linkedinuser"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: false
    
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      tags: Other
