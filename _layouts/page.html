---
layout: default
---
<article class="page-content">
  <header class="page-heading">
    <p class="eyebrow">{{ site.author | escape }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="page-description">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
