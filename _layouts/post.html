---
layout: default
---
<article class="post h-entry" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="post-header">
    <a class="eyebrow back-link" href="{{ '/archive.html' | relative_url }}">← Back to the blog</a>
    <h1 class="p-name" itemprop="headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: '%d %B %Y' }}</time>
      <span aria-hidden="true">·</span>
      <span class="p-author" itemprop="author">{{ page.author | default: site.author | escape }}</span>
    </p>
  </header>
  <div class="prose post-content e-content" itemprop="articleBody">{{ content }}</div>
  <div class="post-end">
    {% include sharelinks.html %}
    {% include navlinks.html %}
  </div>
  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
