{% assign safeurl = page.url | absolute_url | url_encode %}
{% assign safetitle = page.title | url_encode %}
<nav class="share-links" aria-label="Share this post">
  <span>Share this post</span>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ safeurl }}">Facebook</a>
  <a href="https://twitter.com/intent/tweet?url={{ safeurl }}&amp;text={{ safetitle }}">X / Twitter</a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ safeurl }}">LinkedIn</a>
  <a href="mailto:?subject={{ safetitle }}&amp;body={{ safeurl }}">Email</a>
</nav>
