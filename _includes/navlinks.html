<nav class="post-navigation" aria-label="More posts">
  {% if page.previous.url %}
    <a href="{{ page.previous.url | relative_url }}" rel="prev"><span>← Previous post</span>{{ page.previous.title | escape }}</a>
  {% else %}
    <a href="{{ '/archive.html' | relative_url }}"><span>← Explore</span>All blog posts</a>
  {% endif %}
  {% if page.next.url %}
    <a href="{{ page.next.url | relative_url }}" rel="next"><span>Next post →</span>{{ page.next.title | escape }}</a>
  {% else %}
    <a href="{{ '/archive.html' | relative_url }}"><span>Keep reading →</span>All blog posts</a>
  {% endif %}
</nav>
