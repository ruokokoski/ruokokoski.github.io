<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="{{ '/pics/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% seo %}
  {% feed_meta %}
  <script>{% include theme-init.js %}</script>
  <link rel="stylesheet" href="{{ '/css/override.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script defer src="{{ '/js/theme.js' | relative_url }}"></script>
  {% if page.fluxformer %}
    <link rel="stylesheet" href="{{ '/css/fluxformer.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script type="module" src="{{ '/js/fluxformer.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% endif %}
  {% if page.presentation %}
    <link rel="stylesheet" href="{{ '/css/presentation.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script defer src="{{ '/js/presentation.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% endif %}
  {% if jekyll.environment == 'production' and site.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}
</head>
